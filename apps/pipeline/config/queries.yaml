# GitHub Search Discovery Queries

mcp_queries:
  - "topic:mcp-server archived:false fork:false stars:>=100"
  - "topic:model-context-protocol archived:false fork:false stars:>=100"

skill_queries:
  - "topic:claude-code archived:false fork:false stars:>=100"
  - "topic:agent-skill archived:false fork:false stars:>=100"
  - "topic:agent-skills archived:false fork:false stars:>=100"

code_queries:
  - "filename:SKILL.md"

tool_queries:
  - "topic:ai-agents archived:false fork:false stars:>=250"
  - "topic:coding-agent archived:false fork:false stars:>=150"
  - "topic:autonomous-agents archived:false fork:false stars:>=250"
  - "topic:agent-framework archived:false fork:false stars:>=250"
  - "topic:browser-agent archived:false fork:false stars:>=150"

# Educational / demo keyword blacklist for Gate G9
blacklist_keywords:
  - "awesome-"
  - "awesome-list"
  - "tutorial"
  - "tutorials"
  - "course"
  - "courses"
  - "for-beginners"
  - "examples"
  - "boilerplate"
  - "starter"
  - "template"
  - "curated-list"
