name: Weekly Pipeline Run

on:
  schedule:
    # Runs at 02:00 UTC every Monday
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      force_full_run:
        description: 'Force full re-discovery run'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    name: Execute Discovery & Catalog Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Full Pipeline Runner
        run: pnpm run pipeline:run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push Catalog Changes
        id: commit_step
        run: |
          if [ -n "$(git status --porcelain content/ data/)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add content/ data/
            git commit -m "chore(catalog): weekly catalog refresh [skip ci]"
            git push origin main
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No catalog changes detected this run."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Deployment Workflow
        if: steps.commit_step.outputs.has_changes == 'true'
        run: |
          echo "Triggering deploy.yml workflow..."
          gh workflow run deploy.yml --ref main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
